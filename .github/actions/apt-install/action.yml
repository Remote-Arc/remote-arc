name: Install apt packages from cache
description: >-
  Installs Ubuntu packages from cached .deb files so CI does not depend on a
  fast Ubuntu mirror. The cache is keyed on the runner image version and the
  package list, so a new runner image downloads once and later jobs reuse it.
inputs:
  packages:
    description: Space-separated package names, installed without recommends.
    required: true
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        hash=$(printf '%s' "$PACKAGES" | tr ' ' '\n' | sort -u | sha256sum | cut -c1-16)
        key="apt-debs-v2-${ImageOS:-unknown}-${ImageVersion:-unknown}-$RUNNER_ARCH-$hash"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/$key" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - name: Download the packages on a cache miss
      id: download
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        DEBS: ${{ steps.key.outputs.dir }}
      run: |
        timeout --kill-after=15s 8m bash -euo pipefail <<'DOWNLOAD'
        # The Azure mirror can stall on large codec downloads; use the other mirrors.
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
        fi
        read -r -a packages <<< "$PACKAGES"
        archives=$(mktemp -d "$RUNNER_TEMP/apt-download.XXXXXX")
        chmod 755 "$archives"
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        sudo apt-get "${apt_opts[@]}" update -qq
        sudo apt-get "${apt_opts[@]}" -o Dir::Cache::archives="$archives" \
          install -y --no-install-recommends --download-only -- "${packages[@]}"
        shopt -s nullglob
        debs=("$archives"/*.deb)
        if ((${#debs[@]})); then
          mkdir -p "$DEBS"
          cp -- "${debs[@]}" "$DEBS/"
          echo "cacheable=true" >> "$GITHUB_OUTPUT"
        fi
        DOWNLOAD
    - name: Install the packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        DEBS: ${{ steps.key.outputs.dir }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        debs=("$DEBS"/*.deb)
        if ((${#debs[@]})); then
          sudo dpkg -i "${debs[@]}"
        fi
        read -r -a packages <<< "$PACKAGES"
        for package in "${packages[@]}"; do
          if [[ $(dpkg-query -W -f='${db:Status-Status}' -- "$package") != installed ]]; then
            echo "::error::Ubuntu package $package is not installed"
            exit 1
          fi
        done
    - name: Save the installed packages
      if: steps.download.outputs.cacheable == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
