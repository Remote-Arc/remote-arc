name: Mac capture protocol probes

on:
  push:
    branches: [debug/pr345-mac-capture-20261024]

jobs:
  capture-probe:
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode:
          - baseline-no-automation
          - legacy-surface-no-reacquire
          - native-only-no-reacquire
          - focus-after-hide-no-reacquire
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: |
            apps/agent/go.sum
            packages/execution-core/go.sum
      - name: Fresh machine with three pixel-verified repetitions
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/pr345-capture-probe.py "${{ matrix.mode }}"
          go -C apps/agent test -race ./internal/browserrunner -run '^TestE2EWaitConditionsAndLiveView$' -count=3 -v | tee capture-probe.log
          python3 - <<'PY'
          from pathlib import Path
          text = Path("capture-probe.log").read_text()
          assert "--- SKIP:" not in text, "Browser acceptance was skipped"
          assert text.count("--- PASS: TestE2EWaitConditionsAndLiveView") == 3, "Expected three actual passes"
          assert text.count("CAPTURE_PROBE_UPDATED_FRAME") == 6, "Expected two fresh fixture colors per repetition"
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-probe-${{ matrix.mode }}
          path: capture-probe.log
