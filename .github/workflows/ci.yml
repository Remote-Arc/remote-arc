name: Mac capture protocol probes

on:
  push:
    branches: [debug/pr345-mac-capture-20261024]

jobs:
  capture-probes:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: |
            apps/agent/go.sum
            packages/execution-core/go.sum
      - name: New surface enabled (current source)
        continue-on-error: true
        run: |
          python3 scripts/pr345-capture-probe.py new-surface
          go -C apps/agent test -race ./internal/browserrunner -run '^TestE2EWaitConditionsAndLiveView$' -count=1 -v
      - name: Every frame screencast with no screenshot request
        continue-on-error: true
        run: |
          python3 scripts/pr345-capture-probe.py screencast-1-only
          go -C apps/agent test -race ./internal/browserrunner -run '^TestE2EWaitConditionsAndLiveView$' -count=1 -v
      - name: Every frame screencast plus screenshot fallback
        continue-on-error: true
        run: |
          python3 scripts/pr345-capture-probe.py screencast-1
          go -C apps/agent test -race ./internal/browserrunner -run '^TestE2EWaitConditionsAndLiveView$' -count=1 -v
      - name: Legacy surface snapshot
        continue-on-error: true
        run: |
          python3 scripts/pr345-capture-probe.py legacy-surface
          go -C apps/agent test -race ./internal/browserrunner -run '^TestE2EWaitConditionsAndLiveView$' -count=1 -v
      - name: Native view snapshot without screencast
        continue-on-error: true
        run: |
          python3 scripts/pr345-capture-probe.py native-only
          go -C apps/agent test -race ./internal/browserrunner -run '^TestE2EWaitConditionsAndLiveView$' -count=1 -v
      - name: Focus emulation initialized after native hide
        continue-on-error: true
        run: |
          python3 scripts/pr345-capture-probe.py focus-after-hide
          go -C apps/agent test -race ./internal/browserrunner -run '^TestE2EWaitConditionsAndLiveView$' -count=1 -v
      - name: Disable Mac web contents occlusion
        continue-on-error: true
        run: |
          python3 scripts/pr345-capture-probe.py no-mac-occlusion
          go -C apps/agent test -race ./internal/browserrunner -run '^TestE2EWaitConditionsAndLiveView$' -count=1 -v
      - name: Disable Apple display link
        continue-on-error: true
        run: |
          python3 scripts/pr345-capture-probe.py no-display-link
          go -C apps/agent test -race ./internal/browserrunner -run '^TestE2EWaitConditionsAndLiveView$' -count=1 -v
      - name: Force all compositor stages before draw
        continue-on-error: true
        run: |
          python3 scripts/pr345-capture-probe.py all-compositor-stages
          go -C apps/agent test -race ./internal/browserrunner -run '^TestE2EWaitConditionsAndLiveView$' -count=1 -v
