# Production release: exact master CI -> verified D1 backup -> pending migrations
# -> Relay Worker and website assets -> smoke checks -> optional activation.
# No npm/Go device-agent publishing here. Merging does NOT deploy production.
name: "Production Release - D1 + Relay + Website"
run-name: "Release master @ ${{ github.sha }} | Stripe: ${{ inputs.enable_stripe }} | OpenAI: ${{ inputs.enable_openai }}"

# Production is an explicit promotion, never an automatic consequence of a merge.
on:
  workflow_dispatch:
    inputs:
      enable_stripe:
        description: "OPTIONAL: Activate LIVE Stripe after deploy. OFF skips activation, never disables existing payments."
        required: false
        default: false
        type: boolean
      enable_openai:
        description: "OPTIONAL: Activate hosted OpenAI models/trial after deploy. OFF keeps existing model settings unchanged."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: remote-arc-production
  # Never cancel a production release halfway through its D1 migration.
  cancel-in-progress: false

jobs:
  deploy:
    name: "Production: CI -> D1 -> Relay + Web -> smoke test"
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.actor == 'yaohuangguan'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout promotion candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: "Gate: Verify latest master SHA and successful CI"
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-production-ci.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Gate: Verify Cloudflare production account"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6b1d0dd4e6f7f30df92753cd1e2ee12d
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")"
          RESPONSE="$RESPONSE" node -e '
            const payload = JSON.parse(process.env.RESPONSE || "{}");
            if (payload.success !== true || payload.result?.id !== process.env.CLOUDFLARE_ACCOUNT_ID) {
              console.error("Cloudflare token cannot access the Remote Arc production account.");
              process.exit(1);
            }
            console.log("Verified Remote Arc production Cloudflare account:", payload.result.id);
          '

      - name: "Explain this release (scope and optional switches)"
        env:
          ENABLE_STRIPE: ${{ inputs.enable_stripe }}
          ENABLE_OPENAI: ${{ inputs.enable_openai }}
        run: |
          {
            echo "## Remote Arc production release"
            echo ""
            echo "### Always included"
            echo "1. Exact-master CI and Cloudflare account checks"
            echo "2. D1 remote-link-auth: check migration ledger, verified encrypted backup if pending, apply and verify migrations"
            echo "3. Deploy Relay Worker with website + Agent/Admin Dashboard static assets"
            echo "4. Production smoke checks"
            echo ""
            echo "### Optional provider activation after successful smoke"
            echo "- Stripe live activation: $ENABLE_STRIPE (false = skip only; does not deactivate existing payments)"
            echo "- Hosted OpenAI activation: $ENABLE_OPENAI (false = skip only; does not deactivate existing models)"
            echo ""
            echo "D1 backup is mandatory and automatic when migrations are pending. No manual confirmation."
            echo "Not included: remotelink npm package or local Windows/Mac/Linux Agents."
          } >> "$GITHUB_STEP_SUMMARY"

      # Read production D1 migration history BEFORE any mutation. If nothing
      # is pending, neither backup/export nor D1 apply is needed.
      # Unknown history, permission errors and JSON parsing errors fail closed.
      - name: "D1: Create encrypted, restore-tested backup if needed"
        id: d1_backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          D1_BACKUP_KEY: ${{ secrets.D1_BACKUP_KEY }}
        run: node scripts/d1-production-backup.mjs --out "$RUNNER_TEMP/remote-arc-d1-backup"

      - name: "D1: Retain verified encrypted backup (7 days)"
        if: steps.d1_backup.outputs.backup_verified == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: production-d1-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.d1_backup.outputs.backup_directory }}/*.enc
            ${{ steps.d1_backup.outputs.backup_directory }}/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: "D1: Check migration ledger and enforce backup gate"
        id: d1_preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6b1d0dd4e6f7f30df92753cd1e2ee12d
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          if [ "${{ steps.d1_backup.outputs.backup_verified }}" = "true" ]; then
            # Attest only after export, isolated restore, authenticated encryption,
            # decryption/re-restore and successful encrypted artifact retention.
            export BACKUP_CONFIRMATION=BACKUP_VERIFIED
          fi
          node scripts/d1-promotion-preflight.mjs

      - name: "D1: Apply pending remote-link-auth migrations"
        if: steps.d1_preflight.outputs.needs_migration == 'true'
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6b1d0dd4e6f7f30df92753cd1e2ee12d
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_D1_API_TOKEN. Create an Account > D1 > Edit token for the Remote Arc Cloudflare account before deploying."
            exit 1
          fi
          pnpm exec wrangler d1 migrations apply remote-link-auth --remote
          pnpm exec wrangler d1 migrations list remote-link-auth --remote

      - name: "D1: Verify migration ledger is clean"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6b1d0dd4e6f7f30df92753cd1e2ee12d
        run: |
          set -euo pipefail
          # A second read also fences concurrent migrations/partial apply.
          BACKUP_CONFIRMATION=BACKUP_VERIFIED node scripts/d1-promotion-preflight.mjs --assert-clean
          # The preflight above must report no pending migrations.
          cd apps/relay
          pnpm exec wrangler d1 migrations list remote-link-auth --remote

      - name: "Secrets: Ensure Apps vault without rotating keys"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6b1d0dd4e6f7f30df92753cd1e2ee12d
          APP_TOKEN_KEY: ${{ secrets.APP_TOKEN_KEY }}
        run: node scripts/ensure-apps-vault.mjs

      - name: "Deploy: Relay Worker + Website + Agent/Admin dashboards"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REMOTEARC_PRODUCTION_DEPLOY: github-actions
          REMOTEARC_DEPLOY_SHA: ${{ github.sha }}
          REMOTEARC_DEPLOY_REF: master
        run: pnpm deploy:relay

      - name: "Secrets: Configure Slack request verification"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6b1d0dd4e6f7f30df92753cd1e2ee12d
          APP_SLACK_SIGNING_SECRET: ${{ secrets.APP_SLACK_SIGNING_SECRET }}
        run: node scripts/configure-slack-bot.mjs

      - name: "Assets: Configure Stripe public key (NOT live activation)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: node scripts/configure-stripe-public-key.mjs

      - name: "Smoke: Verify deployed SHA, URLs, MCP and OAuth"
        timeout-minutes: 5
        run: node scripts/production-smoke.mjs --sha "$GITHUB_SHA"

      - name: "Optional: Activate hosted OpenAI models (explicit opt-in)"
        if: inputs.enable_openai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm --filter @remotearc/relay exec tsx ../../scripts/activate-openai.mjs

      - name: "Optional: Activate live Stripe payments (explicit opt-in)"
        if: inputs.enable_stripe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: pnpm --filter @remotearc/relay exec tsx ../../scripts/activate-stripe.mjs

      - name: "Summary: Record successful release and D1 outcome"
        if: success()
        env:
          D1_MIGRATED: ${{ steps.d1_preflight.outputs.needs_migration }}
          ENABLE_STRIPE: ${{ inputs.enable_stripe }}
          ENABLE_OPENAI: ${{ inputs.enable_openai }}
        run: |
          {
            echo ""
            echo "## Release completed"
            echo "- Commit: $GITHUB_SHA"
            if [ "$D1_MIGRATED" = "true" ]; then
              echo "- D1 remote-link-auth: pending migrations applied and verified"
            else
              echo "- D1 remote-link-auth: no pending migrations"
            fi
            echo "- Cloudflare: Relay + Website + Agent/Admin dashboards deployed"
            echo "- Production smoke: passed"
            echo "- Hosted OpenAI activation: $ENABLE_OPENAI (false = skipped, not deactivated)"
            echo "- Live Stripe activation: $ENABLE_STRIPE (false = skipped, not deactivated)"
            echo "- NPM/Go local Agents: not updated"
          } >> "$GITHUB_STEP_SUMMARY"
