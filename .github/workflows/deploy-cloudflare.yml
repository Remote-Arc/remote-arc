name: Deploy Cloudflare

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-arc-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare production account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6b1d0dd4e6f7f30df92753cd1e2ee12d
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")"
          RESPONSE="$RESPONSE" node -e '
            const payload = JSON.parse(process.env.RESPONSE || "{}");
            if (payload.success !== true || payload.result?.id !== process.env.CLOUDFLARE_ACCOUNT_ID) {
              console.error("Cloudflare token cannot access the Remote Arc production account.");
              process.exit(1);
            }
            console.log("Verified Remote Arc production Cloudflare account:", payload.result.id);
          '

      - name: Apply and verify production D1 migrations
        working-directory: apps/relay
        env:
          # Separate, account-scoped D1 Edit token; never reuse the Worker deploy token.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          # Wrangler's migrations list needs an explicit account ID with a scoped D1 token.
          CLOUDFLARE_ACCOUNT_ID: 6b1d0dd4e6f7f30df92753cd1e2ee12d
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_D1_API_TOKEN. Create an Account > D1 > Edit token for the Remote Arc Cloudflare account before deploying."
            exit 1
          fi
          # Fail closed on 7403, missing token, SQL errors or pending migrations.
          pnpm exec wrangler d1 migrations apply remote-link-auth --remote
          pnpm exec wrangler d1 migrations list remote-link-auth --remote

      - name: Deploy Remote Arc to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REMOTEARC_PRODUCTION_DEPLOY: github-actions
          REMOTEARC_DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REMOTEARC_DEPLOY_REF: master
        run: pnpm deploy:relay
