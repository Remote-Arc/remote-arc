name: Preview UI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: remote-arc-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Preview Navigation
        run: node scripts/preview-comment.test.cjs

      - name: Build UI
        env:
          VITE_UI_PREVIEW: "1"
          # Public R2 artifacts are shared with production; Wrangler previews may omit bucket bindings.
          VITE_MEDIA_GALLERY_BASE_URL: "https://remotearc.app"
        run: pnpm --filter @remotearc/ui build

      - id: preview
        name: Create or update Cloudflare Preview
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          output="$(pnpm --filter @remotearc/relay exec wrangler preview             --config ../../apps/ui/wrangler.preview.jsonc             --name "pr-${{ github.event.pull_request.number }}"             --message "PR #${{ github.event.pull_request.number }} @ ${{ github.sha }}"             --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s' "$json" | jq -er '.preview.urls[0]')"
          unique_url="$(printf '%s' "$json" | jq -r '.deployment.urls[0] // empty')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "unique_url=$unique_url" >> "$GITHUB_OUTPUT"

      - name: Add preview link to pull request
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          UNIQUE_URL: ${{ steps.preview.outputs.unique_url }}
        with:
          script: |
            const { buildPreviewComment, MARKER } = require('./scripts/preview-comment.cjs');
            const marker = MARKER;
            const body = buildPreviewComment(process.env.PREVIEW_URL, process.env.UNIQUE_URL);

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(
              comment => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'keep-preview')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Cloudflare Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter @remotearc/relay exec wrangler preview delete             --config ../../apps/ui/wrangler.preview.jsonc             --name "pr-${{ github.event.pull_request.number }}"             --skip-confirmation
