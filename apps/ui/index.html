<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111114" />
    <meta name="application-name" content="Remote Arc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Remote Arc" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/remote-arc-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/remote-arc-192.png" />
    <link rel="preload" href="/fonts/SpaceGroteskVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/remote-arc.svg" as="image" type="image/svg+xml" />
    <script>
      try {
        const admin = location.hostname === "admin.remotearc.app";
        const product = admin || ["agent.remotearc.app","mcp.remotearc.app"].includes(location.hostname) || /^\/(dashboard|overview|device|devices|apps|automations|connect|security|settings|checkout|chat|tasks|routines|activity|skills)(?:\/|$)/.test(location.pathname);
        document.documentElement.dataset.surface = product ? "product" : "marketing";
        if (admin) document.querySelector('link[rel="manifest"]').setAttribute("href", "/admin.webmanifest");
        if (product) {
          const name = admin ? "Remote Arc Admin" : "Remote Arc Agent";
          document.querySelector('meta[name="application-name"]').setAttribute("content", name);
          document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute("content", name);
        }
        const saved = localStorage.getItem(product ? "remote-arc-dashboard-theme-v3" : "remote-arc-theme");
        const resolved = saved === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : (saved === "light" || saved === "dark" ? saved : "dark");
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", resolved === "dark" ? "#111113" : "#fafafa");
      } catch {}
    </script>
    <style>html[data-theme="light"]{background:#fdfdfd;color:#222226}html[data-theme="dark"]{background:#111114;color:#eeeef1}body{margin:0;background:inherit}:root[data-surface="marketing"]{--bg:#fdfdfd}:root[data-surface="marketing"][data-theme="dark"]{--bg:#111114}:root[data-surface="marketing"][data-theme] body{background:inherit!important}html[data-surface="product"]{background:#fff;color:#202024}html[data-surface="product"][data-theme="dark"]{background:#111114;color:#eeeef1}html[data-surface="product"] body{margin:0;background:inherit}</style>
    <link rel="icon" type="image/svg+xml" href="/remote-arc.svg" />
    <link rel="canonical" href="https://remotearc.app/" />
    <meta property="og:site_name" content="Remote Arc" />
    <meta property="og:title" content="Remote Arc — Connect AI to Apps &amp; Computers" />
    <meta property="og:description" content="Connect AI to your apps and computers with per-device permissions and cross-device workflows. Delegate goals to Arc with retained context, scheduled judgment and result checks." />
    <meta property="og:url" content="https://remotearc.app/" />
    <meta property="og:image" content="https://remotearc.app/remote-arc.svg" />
    <meta name="description" content="Connect AI to your apps and computers with per-device permissions and cross-device workflows. Delegate goals to Arc with retained context, scheduled judgment and result checks." />
    <title>Remote Arc — Connect AI to Apps &amp; Computers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
